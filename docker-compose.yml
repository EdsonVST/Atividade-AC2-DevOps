
services:

  # ==========================================
  # BANCO DE DADOS POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:16
    container_name: gamificacao-postgres
    hostname: postgres
    restart: always

    environment:
      POSTGRES_DB: gamificacao_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamificacao_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      app_net:
        aliases:
          - postgres

  # ==========================================
  # PGADMIN
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: gamificacao-pgadmin
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - app_net

  # ==========================================
  # API GAMIFICACAO - SPRING BOOT
  # ==========================================
  app:
    build: .
    container_name: gamificacao-api-app
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gamificacao_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    ports:
      - "8080:8080"

    networks:
      - app_net

  # ==========================================
  # PROMETHEUS - COLETA DE METRICAS
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: gamificacao-prometheus
    restart: always

    depends_on:
      - app

    ports:
      - "9091:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - app_net

  # ==========================================
  # GRAFANA - DASHBOARD DE MONITORAMENTO
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: gamificacao-grafana
    restart: always

    depends_on:
      - prometheus

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - app_net

# ==========================================
# VOLUMES PERSISTENTES
# ==========================================
volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:

# ==========================================
# REDE INTERNA DOCKER
# ==========================================
networks:
  app_net:
    driver: bridge
