
# Nome da aplicacao
spring.application.name=gamificacao-api

# Define o perfil utilizado (H2 local ou PostgreSQL no Docker)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Configuracoes do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracao do Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# MONITORAMENTO - ACTUATOR E PROMETHEUS
# ==========================================

# Disponibiliza os endpoints de saude e metricas
management.endpoints.web.exposure.include=health,info,prometheus

# Disponibiliza o health check
management.endpoint.health.enabled=true

# Disponibiliza as metricas do Prometheus
management.endpoint.prometheus.enabled=true

# Exibe somente o status geral da aplicacao
management.endpoint.health.show-details=never
